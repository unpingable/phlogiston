[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "community-submit"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Participant-side self-submission tool for ATProto communities."
requires-python = ">=3.12,<3.13"
dependencies = ["community-model==0.1.0"]

[project.scripts]
community-submit = "community_submit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["community_submit", "community_submit.*"]
namespaces = false

[tool.setuptools.package-data]
community_submit = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src", "../community-model/src"]
