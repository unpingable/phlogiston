[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "community-space-feed"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Pure local SCV0 public projection feed boundary."
requires-python = ">=3.12,<3.13"
dependencies = ["community-space-artifact==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["community_space_feed", "community_space_feed.*"]
namespaces = false

[tool.setuptools.package-data]
community_space_feed = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../community-model/src",
    "../community-space-model/src",
    "../community-space-projection/src",
    "../community-space-artifact/src",
    "../community-space-renderer/src",
]
