[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "community-model"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Inert contracts and deterministic projection values for ATProto communities."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["community_model", "community_model.*"]
namespaces = false

[tool.setuptools.package-data]
community_model = ["py.typed", "UNICODE-LICENSE.txt", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src"]
