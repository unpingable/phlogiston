[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "community-space-projection"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Pure lifecycle reducer for Space-backed community projections."
requires-python = ">=3.12,<3.13"
dependencies = [
    "community-model==0.1.0",
    "community-space-model==0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["community_space_projection", "community_space_projection.*"]
namespaces = false

[tool.setuptools.package-data]
community_space_projection = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src", "../community-model/src", "../community-space-model/src"]
