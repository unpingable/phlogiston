[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "communitywatch-web"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Read-only canonical web AppView for the ATProto community observer."
requires-python = ">=3.12,<3.13"
dependencies = [
    "community-model==0.1.0",
    "communitywatch==0.1.0",
]

[project.scripts]
communitywatch-web = "communitywatch_web.cli:main"
communitywatch-history-demo = "communitywatch_web.history_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["communitywatch_web", "communitywatch_web.*"]
namespaces = false

[tool.setuptools.package-data]
communitywatch_web = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src", "../community-model/src", "../communitywatch/src"]
