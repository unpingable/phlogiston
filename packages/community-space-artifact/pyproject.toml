[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "community-space-artifact"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Pure synthetic SCV0 projection artifact compiler."
requires-python = ">=3.12,<3.13"
dependencies = [
    "community-model==0.1.0",
    "community-space-model==0.1.0",
    "community-space-projection==0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["community_space_artifact", "community_space_artifact.*"]
namespaces = false

[tool.setuptools.package-data]
community_space_artifact = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../community-model/src",
    "../community-space-model/src",
    "../community-space-projection/src",
    "../community-space-wire/src",
]
