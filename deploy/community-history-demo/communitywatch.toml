# Read-only retained V0 evidence demo. Network URLs are syntactically required
# by the shared observer config but this process never constructs a transport.
community_did = "did:plc:exampleparticipantabcdef"
community_slug = "example-x7"
sqlite_path = "/var/lib/atproto-community-demo/observer.sqlite3"
event_source_url = "wss://not-used.invalid"
resolver_url = "https://not-used.invalid"
# The container binds its private namespace; Docker publishes only host
# 127.0.0.1:8138.
bind = "0.0.0.0"
port = 8138
page_size = 50
max_page_size = 100
stale_threshold_seconds = 180
