[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = [
    "packages/community-model/tests",
    "packages/community-policy/tests",
    "packages/community-notify/tests",
    "packages/community-space-model/tests",
    "packages/community-space-projection/tests",
    "packages/community-space-wire/tests",
    "packages/community-space-artifact/tests",
    "packages/community-space-renderer/tests",
    "packages/community-space-feed/tests",
    "packages/community-space-prototype/tests",
    "packages/community-space-comprehension/tests",
    "packages/community-space-demo/tests",
    "packages/communitywatch/tests",
    "packages/communitywatch-spaces-alpha/tests",
    "packages/communitywatch-space-publisher/tests",
    "packages/communitywatch-live/tests",
    "packages/communitywatch-archive/tests",
    "packages/communitywatch-web/tests",
    "packages/communityd/tests",
    "packages/community-submit/tests",
    "tests",
    "tests/acceptance",
]
pythonpath = [
    "packages/community-model/src",
    "packages/community-policy/src",
    "packages/community-notify/src",
    "packages/community-space-model/src",
    "packages/community-space-projection/src",
    "packages/community-space-wire/src",
    "packages/community-space-artifact/src",
    "packages/community-space-renderer/src",
    "packages/community-space-feed/src",
    "packages/community-space-prototype/src",
    "packages/community-space-comprehension/src",
    "packages/community-space-demo/src",
    "packages/communitywatch/src",
    "packages/communitywatch-spaces-alpha/src",
    "packages/communitywatch-space-publisher/src",
    "packages/communitywatch-live/src",
    "packages/communitywatch-archive/src",
    "packages/communitywatch-web/src",
    "packages/communityd/src",
    "packages/community-submit/src",
]

